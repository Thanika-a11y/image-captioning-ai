<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Captioning</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#141e30,#243b55);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.container{
width:90%;
max-width:700px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:30px;
border-radius:25px;
box-shadow:0 0 30px rgba(0,255,255,0.4);
text-align:center;
animation:fadeIn 1s ease;
}

h1{
font-size:3rem;
margin-bottom:15px;
color:#00ffff;
text-shadow:0 0 15px #00ffff;
}

p{
margin-bottom:20px;
font-size:1.1rem;
opacity:0.9;
}

.upload-box{
border:2px dashed #00ffff;
padding:25px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
margin-bottom:20px;
}

.upload-box:hover{
background:rgba(0,255,255,0.1);
}

input{
display:none;
}

img{
max-width:100%;
max-height:350px;
margin-top:20px;
border-radius:20px;
display:none;
box-shadow:0 0 20px rgba(255,255,255,0.2);
}

button{
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:15px;
background:#00ffff;
color:black;
font-size:1rem;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
background:white;
}

.caption-box{
margin-top:25px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.1);
font-size:1.2rem;
line-height:1.6;
display:none;
animation:fadeIn 0.8s ease;
}

.loader{
display:none;
margin-top:20px;
font-size:18px;
color:#00ffff;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<h1>🧠 AI Image Captioning</h1>

<p>Upload any image and get smart AI-generated captions instantly ✨</p>

<label class="upload-box">
📤 Click To Upload Image
<input type="file" id="imageInput" accept="image/*">
</label>

<img id="preview">

<br>

<button onclick="generateCaption()">Generate Caption</button>

<div class="loader" id="loader">
⚡ AI is analyzing image...
</div>

<div class="caption-box" id="captionBox"></div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

let selectedImage = null;

imageInput.addEventListener("change",(e)=>{

selectedImage = e.target.files[0];

if(selectedImage){

preview.src = URL.createObjectURL(selectedImage);
preview.style.display = "block";

}

});

async function generateCaption(){

if(!selectedImage){

alert("Please upload image first!");
return;

}

const loader = document.getElementById("loader");
const captionBox = document.getElementById("captionBox");

loader.style.display = "block";
captionBox.style.display = "none";

const reader = new FileReader();

reader.readAsDataURL(selectedImage);

reader.onload = async ()=>{

const base64Image = reader.result.split(",")[1];

try{

const response = await fetch(
"https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-base",
{
method:"POST",
headers:{
"Authorization":"Bearer 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",
"Content-Type":"application/json"
},
body:JSON.stringify({
inputs:base64Image
})
}
);

const data = await response.json();

loader.style.display = "none";

captionBox.style.display = "block";

if(data.error){

captionBox.innerHTML = "❌ Error: " + data.error;

}else{

captionBox.innerHTML =
"✨ <b>AI Caption:</b><br><br>" +
data[0].generated_text;

}

}catch(error){

loader.style.display = "none";

captionBox.style.display = "block";

captionBox.innerHTML =
"❌ Something went wrong!";

}

};

}

</script>

</body>
</html>
