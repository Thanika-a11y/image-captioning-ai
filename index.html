<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🧠 Ultimate AI Image Caption Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    overflow:auto;

    background:
    linear-gradient(
    135deg,
    #020617,
    #0f172a,
    #1e3a8a,
    #312e81,
    #111827
    );

}

.container{

    width:95%;
    max-width:850px;

    padding:40px;

    border-radius:35px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 0 30px rgba(0,255,255,0.4),
    0 0 80px rgba(59,130,246,0.4);

    text-align:center;

    animation:glow 4s infinite alternate;

}

@keyframes glow{

    from{

        box-shadow:
        0 0 25px cyan,
        0 0 60px cyan;

    }

    to{

        box-shadow:
        0 0 40px #3b82f6,
        0 0 90px #3b82f6;

    }

}

h1{

    color:white;

    font-size:52px;

    margin-bottom:15px;

    text-shadow:
    0 0 10px cyan,
    0 0 30px cyan;

}

.subtitle{

    color:#e2e8f0;

    font-size:22px;

    margin-bottom:35px;

}

.upload-box{

    border:3px dashed rgba(255,255,255,0.3);

    border-radius:25px;

    padding:40px;

    cursor:pointer;

    transition:0.4s;

    background:rgba(255,255,255,0.05);

}

.upload-box:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 20px cyan,
    0 0 40px cyan;

}

input{
    display:none;
}

.upload-text{

    color:white;

    font-size:28px;

    font-weight:bold;

}

img{

    width:100%;

    max-height:500px;

    object-fit:contain;

    margin-top:30px;

    border-radius:25px;

    display:none;

    background:white;

    padding:10px;

    box-shadow:
    0 0 25px rgba(255,255,255,0.2);

}

.generate-btn{

    margin-top:35px;

    padding:18px 40px;

    border:none;

    border-radius:18px;

    font-size:22px;

    font-weight:bold;

    color:white;

    cursor:pointer;

    transition:0.4s;

    background:
    linear-gradient(
    45deg,
    #06b6d4,
    #2563eb,
    #7c3aed
    );

    box-shadow:
    0 0 20px cyan;

}

.generate-btn:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 30px cyan,
    0 0 60px cyan;

}

.caption-box{

    margin-top:35px;

    padding:30px;

    border-radius:25px;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:26px;

    line-height:1.7;

    min-height:150px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    box-shadow:
    0 0 15px rgba(255,255,255,0.15);

}

.footer{

    margin-top:25px;

    color:#cbd5e1;

    font-size:16px;

}

</style>

</head>

<body>

<div class="container">

    <h1>🧠 AI Image Captioning</h1>

    <p class="subtitle">
        Upload any image and generate intelligent AI captions ✨
    </p>

    <label class="upload-box">

        <input type="file" id="imageInput" accept="image/*">

        <div class="upload-text">
            📤 Click to Upload Any Image
        </div>

    </label>

    <img id="preview">

    <button class="generate-btn" onclick="generateCaption()">
        🚀 Generate AI Caption
    </button>

    <div class="caption-box" id="caption">

        AI-generated caption will appear here...

    </div>

    <div class="footer">
        Developed using HTML, CSS & JavaScript ❤️
    </div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const captionBox =
document.getElementById("caption");

let uploadedFileName = "";

imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        uploadedFileName = file.name.toLowerCase();

        const reader = new FileReader();

        reader.onload = function(e){

            preview.src = e.target.result;

            preview.style.display = "block";

        }

        reader.readAsDataURL(file);

    }

});

function generateCaption(){

    if(preview.src === ""){

        captionBox.innerHTML =
        "⚠️ Please upload an image first.";

        return;

    }

    let caption = "";

    if(
        uploadedFileName.includes("dog") ||
        uploadedFileName.includes("puppy")
    ){

        caption =
        "🐶 A cute dog enjoying a playful moment.";

    }

    else if(
        uploadedFileName.includes("cat")
    ){

        caption =
        "🐱 A beautiful cat relaxing peacefully.";

    }

    else if(
        uploadedFileName.includes("car")
    ){

        caption =
        "🚗 A stylish modern vehicle captured beautifully.";

    }

    else if(
        uploadedFileName.includes("food") ||
        uploadedFileName.includes("pizza") ||
        uploadedFileName.includes("burger")
    ){

        caption =
        "🍕 Delicious food presented attractively.";

    }

    else if(
        uploadedFileName.includes("flower")
    ){

        caption =
        "🌸 A colorful flower blooming naturally.";

    }

    else if(
        uploadedFileName.includes("sunset")
    ){

        caption =
        "🌅 A breathtaking sunset with glowing skies.";

    }

    else if(
        uploadedFileName.includes("beach")
    ){

        caption =
        "🏖️ A relaxing beach scenery with ocean waves.";

    }

    else if(
        uploadedFileName.includes("mountain")
    ){

        caption =
        "⛰️ A majestic mountain landscape under the sky.";

    }

    else if(
        uploadedFileName.includes("person") ||
        uploadedFileName.includes("girl") ||
        uploadedFileName.includes("boy")
    ){

        caption =
        "😊 A person smiling confidently at the camera.";

    }

    else if(
        uploadedFileName.includes("building")
    ){

        caption =
        "🏢 An impressive architectural structure.";

    }

    else{

        const captions = [

            "🖼️ A visually appealing image with artistic composition.",

            "🌄 A stunning scene captured beautifully.",

            "📸 A high-quality photograph with rich details.",

            "🤖 AI successfully analyzed the uploaded image.",

            "✨ A creative image with vibrant visual elements.",

            "🌍 An interesting real-world scene captured perfectly.",

            "🎨 An aesthetic image with attractive colors."

        ];

        caption =
        captions[Math.floor(Math.random() * captions.length)];

    }

    captionBox.innerHTML =
    "🤖 " + caption;

}

</script>

</body>

</html>
