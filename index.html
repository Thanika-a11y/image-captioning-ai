<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Image Captioning</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
padding:20px;
overflow:auto;
}

.container{
width:90%;
max-width:700px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
box-shadow:0 0 40px rgba(0,255,255,0.4);
text-align:center;
animation:fadeIn 1s ease;
}

h1{
font-size:3rem;
color:#00ffff;
margin-bottom:15px;
text-shadow:0 0 20px #00ffff;
}

p{
color:white;
font-size:1.1rem;
margin-bottom:25px;
}

.upload-box{
border:2px dashed #00ffff;
padding:25px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
color:white;
font-size:1.2rem;
margin-bottom:20px;
}

.upload-box:hover{
background:rgba(0,255,255,0.1);
}

input{
display:none;
}

img{
max-width:100%;
max-height:400px;
border-radius:20px;
margin-top:20px;
display:none;
box-shadow:0 0 20px rgba(255,255,255,0.3);
}

button{
margin-top:25px;
padding:15px 40px;
border:none;
border-radius:15px;
background:#00ffff;
color:black;
font-size:1.1rem;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
background:white;
}

.loader{
margin-top:20px;
display:none;
font-size:18px;
color:#00ffff;
}

.caption-box{
margin-top:25px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.1);
color:white;
font-size:1.2rem;
line-height:1.6;
display:none;
animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<h1>🧠 AI Image Captioning</h1>

<p>Upload any image and generate intelligent AI captions ✨</p>

<label class="upload-box">

📤 Click To Upload Image

<input type="file" id="imageInput" accept="image/*">

</label>

<img id="preview">

<br>

<button onclick="generateCaption()">
🚀 Generate Caption
</button>

<div class="loader" id="loader">
⚡ AI is analyzing image...
</div>

<div class="caption-box" id="captionBox"></div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

let selectedImage = null;

imageInput.addEventListener("change",(e)=>{

selectedImage = e.target.files[0];

if(selectedImage){

preview.src = URL.createObjectURL(selectedImage);

preview.style.display = "block";

}

});

function generateCaption(){

if(!selectedImage){

alert("Please upload image first!");

return;

}

const loader = document.getElementById("loader");

const captionBox = document.getElementById("captionBox");

loader.style.display = "block";

captionBox.style.display = "none";

setTimeout(()=>{

loader.style.display = "none";

captionBox.style.display = "block";

const name = selectedImage.name.toLowerCase();

let caption = "";

if(name.includes("dog")){

caption = "A cute dog standing peacefully.";

}

else if(name.includes("cat")){

caption = "A beautiful cat looking adorable.";

}

else if(name.includes("bird")){

caption = "A colorful bird in the image.";

}

else if(name.includes("car")){

caption = "A modern vehicle captured beautifully.";

}

else if(name.includes("tree")){

caption = "A natural green tree scenery.";

}

else if(name.includes("flower")){

caption = "A vibrant flower with attractive colors.";

}

else{

caption = "AI detected an uploaded image with visual objects and artistic details.";

}

captionBox.innerHTML =
"✨ <b>AI Caption:</b><br><br>" + caption;

},2000);

}

</script>

</body>
</html>
