<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Image Captioning</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
padding:20px;
overflow:auto;
}

.container{
width:90%;
max-width:700px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:30px;
border-radius:25px;
box-shadow:0 0 40px rgba(0,255,255,0.4);
text-align:center;
animation:fadeIn 1s ease;
}

h1{
font-size:3rem;
color:#00ffff;
margin-bottom:15px;
text-shadow:0 0 20px #00ffff;
}

p{
color:white;
font-size:1.1rem;
margin-bottom:25px;
}

.upload-box{
border:2px dashed #00ffff;
padding:25px;
border-radius:20px;
cursor:pointer;
transition:0.3s;
color:white;
font-size:1.2rem;
margin-bottom:20px;
}

.upload-box:hover{
background:rgba(0,255,255,0.1);
}

input{
display:none;
}

img{
max-width:100%;
max-height:400px;
border-radius:20px;
margin-top:20px;
display:none;
box-shadow:0 0 20px rgba(255,255,255,0.3);
}

button{
margin-top:25px;
padding:15px 40px;
border:none;
border-radius:15px;
background:#00ffff;
color:black;
font-size:1.1rem;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
background:white;
}

.loader{
margin-top:20px;
display:none;
font-size:18px;
color:#00ffff;
}

.caption-box{
margin-top:25px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.1);
color:white;
font-size:1.2rem;
line-height:1.6;
display:none;
animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<h1>🧠 AI Image Captioning</h1>

<p>Upload any image and generate intelligent AI captions ✨</p>

<label class="upload-box">

📤 Click To Upload Image

<input type="file" id="imageInput" accept="image/*">

</label>

<img id="preview">

<br>

<button onclick="generateCaption()">
🚀 Generate Caption
</button>

<div class="loader" id="loader">
⚡ AI is analyzing image...
</div>

<div class="caption-box" id="captionBox"></div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

let selectedImage = null;

imageInput.addEventListener("change", function(e){

selectedImage = e.target.files[0];

if(selectedImage){

preview.src = URL.createObjectURL(selectedImage);

preview.style.display = "block";

}

});

function generateCaption(){

if(!selectedImage){

alert("Please upload an image first!");

return;

}

const loader = document.getElementById("loader");

const captionBox = document.getElementById("captionBox");

loader.style.display = "block";

captionBox.style.display = "none";

setTimeout(function(){

loader.style.display = "none";

captionBox.style.display = "block";

const filename =
selectedImage.name.toLowerCase();

let caption = "";

if(
filename.includes("bird")
){

caption =
"🦜 A colorful bird captured beautifully.";

}

else if(
filename.includes("dog")
){

caption =
"🐶 A cute dog standing peacefully.";

}

else if(
filename.includes("cat")
){

caption =
"🐱 A lovely cat relaxing comfortably.";

}

else if(
filename.includes("lion")
){

caption =
"🦁 A powerful lion in the wild.";

}

else if(
filename.includes("tiger")
){

caption =
"🐯 A majestic tiger with bold stripes.";

}

else if(
filename.includes("elephant")
){

caption =
"🐘 A large elephant walking naturally.";

}

else if(
filename.includes("flower")
){

caption =
"🌸 A beautiful flower with vibrant colors.";

}

else if(
filename.includes("tree")
){

caption =
"🌳 A green tree in a natural environment.";

}

else if(
filename.includes("mountain")
){

caption =
"⛰️ A stunning mountain landscape.";

}

else if(
filename.includes("beach")
){

caption =
"🏖️ A relaxing beach with ocean waves.";

}

else if(
filename.includes("sunset")
){

caption =
"🌅 A breathtaking sunset view.";

}

else if(
filename.includes("car")
){

caption =
"🚗 A modern vehicle captured clearly.";

}

else if(
filename.includes("bike")
){

caption =
"🏍️ A stylish bike parked outdoors.";

}

else if(
filename.includes("food")
){

caption =
"🍕 Delicious food served beautifully.";

}

else if(
filename.includes("pizza")
){

caption =
"🍕 A tasty pizza with rich toppings.";

}

else if(
filename.includes("burger")
){

caption =
"🍔 A delicious burger ready to eat.";

}

else if(
filename.includes("house")
){

caption =
"🏠 A beautiful house architecture.";

}

else if(
filename.includes("building")
){

caption =
"🏢 A modern building structure.";

}

else if(
filename.includes("person")
){

caption =
"😊 A person posing confidently.";

}

else if(
filename.includes("girl")
){

caption =
"👧 A smiling girl in the image.";

}

else if(
filename.includes("boy")
){

caption =
"👦 A boy captured naturally.";

}

else if(
filename.includes("baby")
){

caption =
"👶 A cute baby looking adorable.";

}

else if(
filename.includes("nature")
){

caption =
"🌿 A peaceful natural scenery.";

}

else if(
filename.includes("forest")
){

caption =
"🌲 A dense forest filled with greenery.";

}

else if(
filename.includes("sky")
){

caption =
"☁️ A beautiful sky with clouds.";

}

else if(
filename.includes("river")
){

caption =
"🏞️ A flowing river through nature.";

}

else if(
filename.includes("computer")
){

caption =
"💻 A computer setup with modern technology.";

}

else if(
filename.includes("phone")
){

caption =
"📱 A smartphone displayed clearly.";

}

else if(
filename.includes("robot")
){

caption =
"🤖 A futuristic robot design.";

}

else if(
filename.includes("anime")
){

caption =
"🎌 An anime-style illustrated character.";

}

else if(
filename.includes("football")
){

caption =
"⚽ A football sports action moment.";

}

else if(
filename.includes("cricket")
){

caption =
"🏏 A cricket-related sports scene.";

}

else{

caption =
"🖼️ AI detected an uploaded image with visual elements and artistic composition.";

}

captionBox.innerHTML =
"✨ <b>AI Caption:</b><br><br>" + caption;

},2000);

}

</script>

</body>
</html>
